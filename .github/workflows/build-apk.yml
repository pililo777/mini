name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK, build tools and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"

      - name: Fetch pinned tun2socks source
        run: |
          rm -rf app/src/main/jni/hev-socks5-tunnel
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git app/src/main/jni/hev-socks5-tunnel
          cd app/src/main/jni/hev-socks5-tunnel
          git checkout 4d6c334
          git submodule update --init --recursive
          test "$(git rev-parse --short HEAD)" = "4d6c334"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniSSH-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
